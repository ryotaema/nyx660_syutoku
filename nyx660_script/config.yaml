sdk_path: ../../ScepterSDK  # config.yaml からの相対パス。別環境では変更してください

camera:
  # ScepterGUITool で調整してエクスポートしたパラメータJSON（config.yaml からの相対パス）。
  # 解像度・FPS・ワークモード・露光時間・フィルタ・Fillhole・IRGm補正は、
  # utils.py の open_camera() がJSONの値を個別API（scSetExposureTime等）で
  # 1つずつ適用する（scSetParamsByJsonは実機で反映されないため不使用。詳細は
  # ../../log_nyx/2026-07-10.md）。
  # fps / color_width / color_height はこのJSONの Control.FrameRate /
  # ColorResolution から自動で読み取られるため、ここには書かない。
  # 明示的に上書きしたい場合のみ fps: / color_width: / color_height: を追加する
  # （CLI --fps / --color-size でも上書き可）。
  params_json: camera_params/NYX660_2026_07_07_14_45_38_0359.json
  depth_alpha: 0.4   # depth colormap 倍率（調整して使用）

output:
  images_dir: ../data/images        # config.yaml からの相対パス
  pointcloud_dir: ../data/pointcloud
  timelapse_dir: ../data/timelapse_data
  mp4_dir: ../data/mp4

model:
  yolo_path: model/best.pt          # config.yaml からの相対パス
  confidence_threshold: 0.5

pointcloud:
  capture_frames: 50  # auto モードのデフォルトフレーム数
  voxel_size: 0.005   # ICP前処理・出力のダウンサンプリング解像度 (m)
  icp_threshold: 0.02 # ICP 最大対応点距離 (m)

# フィルタ・露光時間・Fillhole等は camera.params_json（ScepterGUIToolエクスポート）で
# 一括管理する。個別のfilters設定は廃止（utils.pyのopen_camera()がJSONの値を
# 個別APIで適用するため、ここに書いても反映されない）。
